<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .password-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .password-strength {
            height: 4px;
            background-color: #e9ecef;
            margin-top: 8px;
            border-radius: 2px;
        }
        .password-strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="password-card">
        {% if validlink %}
            <h2 class="text-center mb-4">Set New Password</h2>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="form-floating mb-3">
                    <input type="password" name="new_password1" class="form-control" id="id_new_password1" placeholder="New password" required>
                    <label for="id_new_password1">New password</label>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="password-strength-bar"></div>
                    </div>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" name="new_password2" class="form-control" id="id_new_password2" placeholder="Confirm password" required>
                    <label for="id_new_password2">Confirm password</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2">Change Password</button>
            </form>
            
            <script>
                document.getElementById('id_new_password1').addEventListener('input', function() {
                    const password = this.value;
                    const strengthBar = document.getElementById('password-strength-bar');
                    let strength = 0;
                    
                    if (password.length > 0) strength += 20;
                    if (password.length >= 8) strength += 30;
                    if (/[A-Z]/.test(password)) strength += 15;
                    if (/[0-9]/.test(password)) strength += 15;
                    if (/[^A-Za-z0-9]/.test(password)) strength += 20;
                    
                    strength = Math.min(strength, 100);
                    strengthBar.style.width = strength + '%';
                    
                    if (strength < 40) {
                        strengthBar.style.backgroundColor = '#dc3545';
                    } else if (strength < 70) {
                        strengthBar.style.backgroundColor = '#fd7e14';
                    } else {
                        strengthBar.style.backgroundColor = '#198754';
                    }
                });
            </script>
        {% else %}
            <h2 class="text-center mb-4">Invalid Link</h2>
            <div class="alert alert-danger">
                The password reset link was invalid, possibly because it has already been used. 
                Please request a new password reset.
            </div>
            <a href="{% url 'accounts:password_reset' %}" class="btn btn-primary w-100 py-2">Request New Reset Link</a>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
