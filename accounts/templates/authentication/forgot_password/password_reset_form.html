<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .reset-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .form-floating label {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
            {% include "alerts.html" %}
        </div>
        <h2 class="text-center mb-4">Reset Your Password</h2>
        <p class="text-muted mb-4">Enter your email address and we'll send you a link to reset your password.</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" id="id_email" placeholder="name@example.com" required>
                <label for="id_email">Email address</label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'accounts:login' %}" class="text-decoration-none">Back to login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
